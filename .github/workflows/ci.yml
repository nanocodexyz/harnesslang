name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: 1.100.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHECK_JOBS: 4
      SEEDS: 0..300
      TWICE_SEEDS: 0..60
      RUST_DIFF_SEEDS: 0..40
      JS_DIFF_SEEDS: 0..40
      WASM_DIFF_SEEDS: 0..40
      WASM_NATIVE_DIFF_SEEDS: 0..10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: check-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'agent/Cargo.lock') }}-${{ github.sha }}
          restore-keys: check-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'agent/Cargo.lock') }}-
      - name: scripts/check.sh
        run: scripts/check.sh
      - name: hl prove on every example and target
        run: scripts/gate.sh --prove

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: gate-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: gate-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build
        run: cargo build --release --locked
      - name: scripts/gate.sh
        run: scripts/gate.sh

  ci-gate:
    name: CI Gate
    if: always()
    needs: [check, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job ended $result"; exit 1; }
          done
