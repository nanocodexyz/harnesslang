[workspace]

[package]
name = "hl-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autobenches = false

[dependencies]
crc = "3"
nanocode-turnlog = { git = "https://github.com/nanocodexyz/nanocode", rev = "395967ffd227ef2158ea824df6ee4c6054d30293" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }

[patch.crates-io]
serde_derive = { git = "https://github.com/nanocodexyz/nanocode", rev = "395967ffd227ef2158ea824df6ee4c6054d30293" }

[[bin]]
name = "hl-oracle"
path = "src/main.rs"
test = false
doctest = false
bench = false
