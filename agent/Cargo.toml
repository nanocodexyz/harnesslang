[workspace]

[package]
name = "hl-agent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"
autotests = false
autobenches = false

[[bin]]
name = "hl-agent"
path = "src/main.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "mock-messages"
path = "src/bin/mock_messages.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "mock-responses"
path = "src/bin/mock_responses.rs"
test = false
doctest = false
bench = false

[dependencies]
harnesslang = { path = ".." }

[build-dependencies]
harnesslang = { path = ".." }
